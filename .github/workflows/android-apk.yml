name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Note: These Capacitor steps assume you have initialized Capacitor in your project.
      # If you haven't, the instructions below explain how to do it.
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: ./android
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: datanurse-app.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
